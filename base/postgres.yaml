apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init-script
  namespace: taranac
data:
  10-init-mfa.sql: |
    CREATE DATABASE taranac_mfa;
    GRANT ALL PRIVILEGES ON DATABASE taranac_mfa TO taranac;
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: taranac
spec:
  serviceName: "postgres"
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          args:
            - "postgres"
            - "-c"
            - "wal_level=replica"
            - "-c"
            - "max_connections=300"
          env:
            - name: TZ
              valueFrom:
                configMapKeyRef:
                  name: taranac-env
                  key: TZ
            - name: POSTGRES_DB
              value: taranac
            - name: POSTGRES_USER
              value: taranac
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: taranac-secrets
                  key: POSTGRES_PASSWORD
            - name: POSTGRES_INITDB_ARGS
              value: "--data-checksums"
          ports:
            - containerPort: 5432
          volumeMounts:
            - name: pg-data
              mountPath: /var/lib/postgresql/data
            - name: initdb
              mountPath: /docker-entrypoint-initdb.d
          readinessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U taranac -d taranac"]
            initialDelaySeconds: 5
            periodSeconds: 10
      volumes:
        - name: pg-data
          persistentVolumeClaim:
            claimName: taranac-db-pvc
        - name: initdb
          configMap:
            name: postgres-init-script
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: taranac
spec:
  selector:
    app: postgres
  ports:
    - port: 5432
      targetPort: 5432