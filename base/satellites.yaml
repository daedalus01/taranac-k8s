apiVersion: apps/v1
kind: Deployment
metadata:
  name: taranac-frontend
  namespace: taranac
spec:
  replicas: 1
  selector:
    matchLabels:
      app: taranac-frontend
  template:
    metadata:
      labels:
        app: taranac-frontend
    spec:
      containers:
        - name: frontend
          image: ghcr.io/taranaclabs/taranac/frontend:latest
          env:
            - name: TZ
              valueFrom:
                configMapKeyRef:
                  name: taranac-env
                  key: TZ
          lifecycle:
            postStart:
              exec:
                command:
                  - /bin/sh
                  - -c
                  - |
                    while true; do
                      if [ -f /etc/nginx/conf.d/default.conf ]; then
                        sed -i 's/127.0.0.11/10.43.0.10/g' /etc/nginx/conf.d/default.conf
                        sed -i 's/set \$api_upstream api;/set \$api_upstream api.taranac.svc.cluster.local;/g' /etc/nginx/conf.d/default.conf
                        if nginx -s reload 2>/dev/null; then
                          break
                        fi
                      fi
                      sleep 1
                    done
          ports:
            - containerPort: 80
          volumeMounts:
            - name: taranac-certs
              mountPath: /opt/taranac/certs
              subPath: certs
              readOnly: true
      volumes:
        - name: taranac-certs
          persistentVolumeClaim:
            claimName: taranac-state-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: taranac
spec:
  selector:
    app: taranac-frontend
  ports:
    - port: 80
      targetPort: 80
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: taranac-renderer
  namespace: taranac
spec:
  replicas: 1
  selector:
    matchLabels:
      app: taranac-renderer
  template:
    metadata:
      labels:
        app: taranac-renderer
    spec:
      containers:
        - name: renderer
          image: ghcr.io/taranaclabs/taranac/renderer:latest
          env:
            - name: TZ
              valueFrom:
                configMapKeyRef:
                  name: taranac-env
                  key: TZ
            - name: REPORTS_RENDERER_API_KEY
              valueFrom:
                secretKeyRef:
                  name: taranac-secrets
                  key: REPORTS_RENDERER_API_KEY
            - name: REPORTS_RENDERER_TLS_CERT
              value: "/opt/taranac/certs/renderer/server.crt"
            - name: REPORTS_RENDERER_TLS_KEY
              value: "/opt/taranac/certs/renderer/server.key"
          ports:
            - containerPort: 8443
          volumeMounts:
            - name: taranac-certs
              mountPath: /opt/taranac/certs
              subPath: certs
              readOnly: true
      volumes:
        - name: taranac-certs
          persistentVolumeClaim:
            claimName: taranac-state-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: taranac-renderer
  namespace: taranac
spec:
  selector:
    app: taranac-renderer
  ports:
    - port: 8443
      targetPort: 8443
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: taranac-mfa
  namespace: taranac
spec:
  replicas: 1
  selector:
    matchLabels:
      app: taranac-mfa
  template:
    metadata:
      labels:
        app: taranac-mfa
    spec:
      containers:
        - name: mfa
          image: ghcr.io/taranaclabs/taranac/mfa:latest
          env:
            - name: TZ
              valueFrom:
                configMapKeyRef:
                  name: taranac-env
                  key: TZ
            - name: TARANAC_MFA_API_KEY
              valueFrom:
                secretKeyRef:
                  name: taranac-secrets
                  key: TARANAC_MFA_API_KEY
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: taranac-secrets
                  key: POSTGRES_PASSWORD
            - name: TARANAC_MFA_DATABASE_URL
              value: "postgresql://taranac:$(POSTGRES_PASSWORD)@postgres:5432/taranac_mfa"
            - name: INTERNAL_TLS_VERIFY
              value: "false"
          ports:
            - containerPort: 8443
---
apiVersion: v1
kind: Service
metadata:
  name: taranac-mfa
  namespace: taranac
spec:
  selector:
    app: taranac-mfa
  ports:
    - port: 8443
      targetPort: 8443
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: taranac
spec:
  selector:
    app: taranac-core
  ports:
    - name: https-api
      port: 8000
      targetPort: 8000