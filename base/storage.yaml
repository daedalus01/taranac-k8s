apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: taranac-db-pvc
  namespace: taranac
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: taranac-state-pvc
  namespace: taranac
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 5Gi