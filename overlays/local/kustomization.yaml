apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

configMapGenerator:
  - name: taranac-env
    namespace: taranac
    envs:
      - config.env

secretGenerator:
  - name: taranac-secrets
    namespace: taranac
    envs:
      - secrets.env

generatorOptions:
  disableNameSuffixHash: true

patches:
  - path: metallb-patch.yaml
  - path: storage-patch.yaml